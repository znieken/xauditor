# xauditor configuration for znie's local environment.
#
# Every block is optional. Live values match the previous file exactly;
# additional commented blocks document the rest of the config surface so
# you can flip a knob without re-deriving it from docs/configuration.md.

# ---------------------------------------------------------------------------
# Runtime + repository scope
# ---------------------------------------------------------------------------
runtime:
  root_dir: .xauditor

repository:
  excludes:
    - .venv
    - node_modules
    - vendors
    - tests

logging:
  level: debug
  # file: /tmp/xauditor.log

