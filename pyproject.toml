[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauditor"
version = "1.0.0"
description = "Repository-wide white-box auditing CLI"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27,<1.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "neo4j>=5.20",
    "psutil>=5.9",
    "pydantic>=2.0",
    "python-lsp-server>=1.14.0",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
xauditor = "xauditor.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
