# Build and publish the `xauditor` package to PyPI via Trusted Publishing.
# PyPI project: xauditor   (pyproject at repo root)
# Trigger: push a tag like `v1.0.0`, or run manually from the Actions tab.
# A single `v*` tag fires all three release workflows (xauditor / portal / coder-service)
# — keep their pyproject versions in lockstep, or move to per-package tag prefixes.
# Filename is load-bearing: PyPI's trusted publisher entry pins this exact name.

name: xauditor release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build --out-dir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
