# Build and publish the `xauditor-portal` package to PyPI via Trusted Publishing.
# PyPI project: xauditor-portal   (pyproject at packages/xauditor-portal/)
# Trigger: push a tag like `xauditor-portal-v1.0.0`, or run manually from the Actions tab.
# Filename is load-bearing: PyPI's trusted publisher entry pins this exact name.
#
# Note: tools/build-portal.sh exists for *local* builds on slow filesystems
# (it stashes frontend/node_modules to skip a setuptools walk). In CI we don't
# install npm deps, so node_modules never exists and a plain `uv build` is fast.

name: xauditor-portal release

on:
  push:
    tags:
      - 'xauditor-portal-v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build packages/xauditor-portal --out-dir packages/xauditor-portal/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/xauditor-portal/dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/xauditor-portal/dist/*
          generate_release_notes: true
